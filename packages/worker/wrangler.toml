name = "painel-parceiroai"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Development environment (default)
[env.development]
name = "painel-parceiroai-dev"
vars = { ENVIRONMENT = "development", N8N_WEBHOOK_URL = "https://your-n8n-instance.com/webhook/boleto-resend" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "painel-parceiroai-db"
database_id = "bc869016-65e8-4181-931d-b45f6e4840c9"

[[env.development.kv_namespaces]]
binding = "KV"
id = "ad78f34ba1804a2e9dae1ed916112016"

# Staging environment
[env.staging]
name = "painel-parceiroai-staging"
vars = { ENVIRONMENT = "staging", N8N_WEBHOOK_URL = "https://your-n8n-instance.com/webhook/boleto-resend" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "painel-parceiroai-db"
database_id = "bc869016-65e8-4181-931d-b45f6e4840c9"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "ad78f34ba1804a2e9dae1ed916112016"

# Production environment
[env.production]
name = "painel-parceiroai-prod"
routes = [
  { pattern = "api.painel.clubemkt.digital", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
N8N_WEBHOOK_URL = "https://your-n8n-instance.com/webhook/boleto-resend"
ASAAS_API_URL = "https://api-sandbox.asaas.com/v3"

[[env.production.d1_databases]]
binding = "DB"
database_name = "painel-parceiroai-db"
database_id = "bc869016-65e8-4181-931d-b45f6e4840c9"

[[env.production.kv_namespaces]]
binding = "KV"
id = "ad78f34ba1804a2e9dae1ed916112016"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "painel-parceiroai-db"
database_id = "bc869016-65e8-4181-931d-b45f6e4840c9"

# KV Namespace binding
[[kv_namespaces]]
binding = "KV"
id = "ad78f34ba1804a2e9dae1ed916112016"

# Environment variables (non-sensitive)
[vars]
N8N_WEBHOOK_URL = "https://your-n8n-instance.com/webhook/boleto-resend"

# Secrets (set via: wrangler secret put SECRET_NAME)
# - WEBHOOK_SECRET: HMAC secret for n8n webhook validation
# - ZUCKZAPGO_SECRET: HMAC secret for ZuckZapGo webhook validation
# - VALID_API_KEYS: Comma-separated list of valid API keys
# - CHATWOOT_TOKEN: Authentication token for Chatwoot integration
